name: CI

on:
  push:
    branches: [ main, "fix/**", "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-with-torch:
    name: Test with Torch (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies in editable mode with Torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,torch]"

      - name: Verify package version import
        run: |
          python -c "import weightspace; print('WeightSpace version:', weightspace.__version__); assert weightspace.PyTorchAdapter.is_available()"

      - name: Run test suite
        run: |
          pytest -q

  test-without-torch:
    name: Test without Torch (ubuntu-latest, Py 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies in editable mode without Torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Verify package version import and ensure Torch is absent
        run: |
          python -c "import weightspace; print('WeightSpace version:', weightspace.__version__); assert not weightspace.PyTorchAdapter.is_available(), 'PyTorch must not be available in no-torch environment'"

      - name: Run test suite with PyTorch tests skipped
        run: |
          pytest -q
