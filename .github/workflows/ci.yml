name: CI

on:
  push:
    branches: [ main, "fix/**", "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies in editable mode
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,torch]"

      - name: Verify package version import
        run: |
          python -c "import weightspace; print('WeightSpace version:', weightspace.__version__)"

      - name: Run test suite
        run: |
          pytest -q
