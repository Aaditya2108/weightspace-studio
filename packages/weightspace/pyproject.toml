[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weightspace"
version = "0.1.0"
description = "Universal framework for Weight-Space Programming"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
]
test = [
    "pytest>=7.0.0",
    "numpy>=1.24.0",
    "safetensors>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
